# Local "CDN": caching reverse proxy in front of the S3 bucket (ADR-0002).
# The browser only ever talks to this server; S3 stays hidden behind it.

# On-disk cache: 10 MB of keys in shared memory, up to 100 MB of files.
# How long a response is cached comes from its Cache-Control header,
# which the deploy script sets as S3 object metadata (ADR-0002, decision 4).
proxy_cache_path /var/cache/nginx/packages keys_zone=packages:10m max_size=100m inactive=7d;

upstream s3 {
  server localstack:4566; # service name from docker-compose.yml
}

server {
  listen 80;

  # Never expose the bucket listing (GET on the bucket root lists every object).
  location = / {
    return 404;
  }

  location / {
    # Read-only CDN: LocalStack accepts any credentials, so without this
    # anyone could PUT/DELETE objects through the CDN.
    limit_except GET {
      deny all;
    }

    # Forward only the path, never the query string: S3 query params like
    # ?acl or ?versions would expose bucket internals.
    proxy_pass http://s3/gw-packages$uri;

    proxy_cache packages;
    proxy_cache_key $uri;
    # Two requests for the same uncached file -> only one goes to S3.
    proxy_cache_lock on;

    # Hide S3 implementation details from the browser.
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-server-side-encryption;

    # Cross-origin module scripts and fetch() need CORS (lesson from the spike).
    add_header Access-Control-Allow-Origin * always;
    # Learning aid: HIT / MISS / EXPIRED / ... visible in DevTools.
    add_header X-Cache-Status $upstream_cache_status always;
  }
}
